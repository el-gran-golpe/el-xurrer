# Single-node Garage for the compose `garage` service. The RPC secret comes
# from GARAGE_RPC_SECRET in .env, so this file holds no secrets.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite survives unclean shutdowns better than the default LMDB.
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
